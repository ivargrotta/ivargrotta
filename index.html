<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ivar. — Ivar Grøtta</title>
  <meta name="description" content="Portfolio for Ivar Grøtta. Kreative idéer, digitale opplevelser og bevegelse.">
  <meta name="theme-color" content="#f4f3ef">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='9.5' cy='16' r='6.5' fill='%2322406b'/%3E%3Ccircle cx='22.5' cy='16' r='6.5' fill='%23b8352f'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="is-loading">

  <!-- Preloader -->
  <div class="loader" aria-hidden="true">
    <div class="loader__dots"><span class="ldot ldot--a" id="ldotA"></span><span class="ldot ldot--b" id="ldotB"></span></div>
    <div class="loader__count"><span id="loaderCount">0</span></div>
    <div class="loader__bar"><span id="loaderBar"></span></div>
    <div class="loader__name">ivar.</div>
  </div>

  <!-- Custom cursor -->
  <div class="cursor" aria-hidden="true">
    <div class="cursor__ring"><span class="cursor__label"></span></div>
    <div class="cursor__dot"></div>
  </div>

  <!-- Ambient background -->
  <div class="ambient" aria-hidden="true">
    <div class="blob blob--a"></div>
    <div class="blob blob--b"></div>
    <div class="blob blob--c"></div>
    <div class="blob blob--d"></div>
    <div class="blob blob--e"></div>
  </div>
  <div class="grain" aria-hidden="true"></div>

  <!-- Header -->
  <header class="header">
    <a href="#" class="logo magnetic" data-close-panel data-cursor="Hjem" aria-label="ivar. — til forsiden">
      <span class="wordmark" aria-hidden="true">ıvar<i class="wm-dot wm-dot--a"></i><i class="wm-dot wm-dot--b"></i></span>
    </a>
    <nav class="nav" aria-label="Hovedmeny">
      <button class="nav__link magnetic" data-panel="arbeid" aria-controls="arbeid" aria-expanded="false"><i class="nav__dot nav__dot--a"></i>Arbeid</button>
      <button class="nav__link magnetic" data-panel="kontakt" aria-controls="kontakt" aria-expanded="false"><i class="nav__dot nav__dot--b"></i>Kontakt</button>
      <button class="nav__close magnetic" data-close-panel aria-label="Lukk" data-cursor="Lukk"><i></i><i></i></button>
    </nav>
  </header>

  <main>
    <!-- The landing: one screen, no scroll. Just the two dots becoming "ivar." -->
    <section class="hero">
      <canvas id="heroCanvas" class="hero__canvas" aria-hidden="true"></canvas>
      <h1 class="sr-only">ivar. — Ivar Grøtta</h1>

      <div class="hero__meta hero__meta--tr reveal-up">
        <span class="eyebrow">Fokus</span>
        <span class="rotator"><span class="rotator__track" id="rotator">
          <span>Kreativ retning</span><span>Digitale opplevelser</span><span>Motion &amp; interaksjon</span><span>Strategi</span><span>Kreativ retning</span>
        </span></span>
      </div>

      <div class="hero__bottom">
        <p class="hero__coords reveal-up" aria-label="Oslo, 59°54′50″N 10°45′08″E">
          <span class="eyebrow">Oslo</span>
          <span class="type" id="coords" data-text="59°54′50″N  10°45′08″E" aria-hidden="true"></span>
        </p>
        <p class="hero__clock reveal-up"><span class="eyebrow">Din tid</span><span id="clock">—:—</span></p>
      </div>
    </section>
  </main>

  <!-- Room 1: Arbeid (light, slides up) -->
  <section class="panel panel--work" id="arbeid" aria-hidden="true" aria-label="Arbeid">
    <div class="panel__scroll">
      <div class="work">
      <div class="folders">
        <button class="folder reveal-up" data-folder="portrett" data-cursor="Åpne" aria-controls="folder-portrett">
          <span class="folder__stack" aria-hidden="true">
            <img src="images/portrett/portrett-01.jpg" alt="" style="--i:0" loading="lazy" decoding="async">
            <img src="images/portrett/portrett-02.jpg" alt="" style="--i:1" loading="lazy" decoding="async">
            <img src="images/portrett/portrett-03.jpg" alt="" style="--i:2" loading="lazy" decoding="async">
            <img src="images/portrett/portrett-04.jpg" alt="" style="--i:3" loading="lazy" decoding="async">
          </span>
          <span class="folder__info">
            <span class="folder__name">Portrett</span>
            <span class="folder__count">04 bilder</span>
          </span>
        </button>
        <button class="folder reveal-up" data-folder="design" data-cursor="Åpne" aria-controls="folder-design">
          <span class="folder__stack" aria-hidden="true">
            <img src="images/design/design-01.jpg" alt="" style="--i:0" loading="lazy" decoding="async">
            <img src="images/design/design-02.jpg" alt="" style="--i:1" loading="lazy" decoding="async">
            <img src="images/design/design-03.jpg" alt="" style="--i:2" loading="lazy" decoding="async">
            <img src="images/design/juletorg-poster.jpg" alt="" style="--i:3" loading="lazy" decoding="async">
          </span>
          <span class="folder__info">
            <span class="folder__name">Design</span>
            <span class="folder__count">03 bilder · 01 film</span>
          </span>
        </button>
      </div>

      </div>

    </div>

    <!-- Folder: Portrett -->
    <div class="folder-view" id="folder-portrett" aria-hidden="true" aria-label="Portrett">
      <div class="folder-view__scroll">
        <div class="folder-view__head">
          <button class="folder-view__back hover-line" data-folder-back data-cursor="Tilbake">← Arbeid</button>
          <h2 class="section-title split" data-split data-dot>Portrett</h2>
          <p class="folder-view__count"><span class="eyebrow">Bilder</span><span>04</span></p>
        </div>
        <div class="photos">
        <button class="photo" data-index="0" data-cursor="Se">
          <img src="images/portrett/portrett-01.jpg" alt="Portrett 1 av 4" loading="lazy" decoding="async">
          <span class="photo__no">01</span>
        </button>
        <button class="photo" data-index="1" data-cursor="Se">
          <img src="images/portrett/portrett-02.jpg" alt="Portrett 2 av 4" loading="lazy" decoding="async">
          <span class="photo__no">02</span>
        </button>
        <button class="photo" data-index="2" data-cursor="Se">
          <img src="images/portrett/portrett-03.jpg" alt="Portrett 3 av 4" loading="lazy" decoding="async">
          <span class="photo__no">03</span>
        </button>
        <button class="photo" data-index="3" data-cursor="Se">
          <img src="images/portrett/portrett-04.jpg" alt="Portrett 4 av 4" loading="lazy" decoding="async">
          <span class="photo__no">04</span>
        </button>
        </div>
      </div>
    </div>

    <!-- Folder: Design -->
    <div class="folder-view" id="folder-design" aria-hidden="true" aria-label="Design">
      <div class="folder-view__scroll">
        <div class="folder-view__head">
          <button class="folder-view__back hover-line" data-folder-back data-cursor="Tilbake">← Arbeid</button>
          <h2 class="section-title split" data-split data-dot>Design</h2>
          <p class="folder-view__count"><span class="eyebrow">Arbeider</span><span>04</span></p>
        </div>
        <div class="photos photos--natural">
        <button class="photo" data-index="0" data-title="Bli med hjem 2019" data-cursor="Se">
          <img src="images/design/design-01.jpg" alt="Kampanjeplakat for Bli med hjem 2019 på storskjerm" loading="lazy" decoding="async">
          <span class="photo__no">01 — Bli med hjem 2019</span>
        </button>
        <button class="photo" data-index="1" data-title="Turbyttedagen" data-cursor="Se">
          <img src="images/design/design-02.jpg" alt="Banner for Turbyttedagen, DNT Romsdal, vist på en laptop" loading="lazy" decoding="async">
          <span class="photo__no">02 — Turbyttedagen</span>
        </button>
        <button class="photo" data-index="2" data-title="Turbyttedagen, illustrasjoner" data-cursor="Se">
          <img src="images/design/design-03.jpg" alt="Illustrerte turgåere fra Turbyttedagen, vist på et nettbrett" loading="lazy" decoding="async">
          <span class="photo__no">03 — Turbyttedagen, illustrasjoner</span>
        </button>
        <button class="photo" data-index="3" data-type="video" data-src="images/design/juletorg.mp4" data-title="Juletorg" data-cursor="Spill">
          <video poster="images/design/juletorg-poster.jpg" muted loop playsinline preload="none" aria-label="Film av illustrert juletorg-dekor med julenissen foran månen"><source src="images/design/juletorg.mp4" type="video/mp4"><source src="images/design/juletorg.webm" type="video/webm"></video>
          <span class="photo__badge">Film</span>
          <span class="photo__no">04 — Juletorg</span>
        </button>
        </div>
      </div>
    </div>
  </section>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-label="Bildevisning">
    <img class="lightbox__img" id="lightboxImg" alt="">
    <video class="lightbox__img lightbox__video" id="lightboxVideo" controls playsinline loop hidden></video>
    <p class="lightbox__title" id="lightboxTitle"></p>
    <button class="lightbox__nav lightbox__nav--prev" data-lb="-1" aria-label="Forrige bilde" data-cursor="Forrige">←</button>
    <button class="lightbox__nav lightbox__nav--next" data-lb="1" aria-label="Neste bilde" data-cursor="Neste">→</button>
    <p class="lightbox__count" id="lightboxCount">01 / 04</p>
    <button class="lightbox__close" data-lb-close aria-label="Lukk bildet" data-cursor="Lukk"><i></i><i></i></button>
  </div>

  <!-- Room 2: Kontakt (the dark room, opens as a circle from the button) -->
  <section class="panel panel--contact" id="kontakt" aria-hidden="true" aria-label="Kontakt">
    <canvas class="panel__canvas" id="menuCanvas"></canvas>
    <div class="panel__scroll">
      <div class="contact">
        <p class="eyebrow">(Kontakt)</p>
        <div class="contact__grid">
          <div class="contact__block">
            <p class="eyebrow">Telefon</p>
            <a class="contact__big hover-line" href="tel:+4798832159" data-cursor="Ring">+47 98 83 21 59</a>
          </div>
          <div class="contact__block">
            <p class="eyebrow">LinkedIn</p>
            <a class="contact__big contact__social hover-line" href="https://www.linkedin.com/in/ivargrotta/" target="_blank" rel="noopener" data-cursor="Besøk">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.75h4v11H3v-11zm6.5 0h3.83v1.5h.05c.53-1 1.84-2.05 3.79-2.05 4.05 0 4.8 2.67 4.8 6.14v5.41h-4v-4.8c0-1.15-.02-2.62-1.6-2.62-1.6 0-1.84 1.25-1.84 2.54v4.88h-4v-11z"/></svg>
              ivargrotta ↗
            </a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
